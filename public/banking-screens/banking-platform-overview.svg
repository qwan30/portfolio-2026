<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Comic Sans MS', Roboto, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#ea580c" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed" />
    </marker>

    <!-- Drop Shadow for Outer Frame -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="#090d16" />

  <!-- Outer Card Frame (White rounded canvas like in Excalidraw UI screenshot) -->
  <rect x="25" y="25" width="1550" height="805" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#soft-shadow)" />

  <!-- ================= TOP SECTION (ROOT & INGRESS) ================= -->

  <!-- Top Root Node: 100 Concurrent Transfers -->
  <g transform="translate(600, 50)">
    <rect width="400" height="52" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" />
    <text x="50" y="32" font-size="20">👥</text>
    <text x="85" y="33" font-size="16" font-weight="700" fill="#15803d">100 Concurrent Reverse Transfer Requests</text>
  </g>

  <!-- Arrow Top -> Gateway -->
  <line x1="800" y1="102" x2="800" y2="128" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- Node 2: Client & Security Ingress -->
  <g transform="translate(520, 130)">
    <rect width="560" height="54" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" />
    <text x="40" y="34" font-size="20">🍃</text>
    <text x="75" y="34" font-size="15" font-weight="700" fill="#1d4ed8">Next.js 16 Client → Spring Boot Controller (JWT Auth + X-Idempotency-Key)</text>
  </g>

  <!-- Arrow Gateway -> Idempotency Registry -->
  <line x1="800" y1="184" x2="800" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- Node 3: Transfer Idempotency Gate -->
  <g transform="translate(550, 212)">
    <rect width="500" height="50" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2.2" />
    <text x="35" y="32" font-size="19">⚙️</text>
    <text x="70" y="32" font-size="15" font-weight="700" fill="#334155">TransferIdempotencyEngine &amp; Request Hash Check</text>
  </g>

  <!-- ================= 4 ARCHITECTURAL BRANCHES ================= -->

  <!-- Top Distribution Branch Lines from Node 3 -->
  <line x1="800" y1="262" x2="800" y2="280" stroke="#475569" stroke-width="2.2" />
  <line x1="200" y1="280" x2="1400" y2="280" stroke="#475569" stroke-width="2.2" />

  <!-- Drop Lines to 4 Columns -->
  <line x1="200" y1="280" x2="200" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />
  <line x1="600" y1="280" x2="600" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />
  <line x1="1000" y1="280" x2="1000" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />
  <line x1="1400" y1="280" x2="1400" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- Column Strategy Labels -->
  <text x="200" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">action=PAYLOAD_MISMATCH</text>
  <text x="600" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">action=KEY_REPLAY</text>
  <text x="1000" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">transfer=DEADLOCK_FREE_LOCK</text>
  <text x="1400" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">transfer=DOUBLE_ENTRY_LEDGER</text>


  <!-- ================= COLUMN 1: PAYLOAD MISMATCH (RED) ================= -->
  <g transform="translate(50, 332)">
    <rect width="300" height="76" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="20" y="38" font-size="18">❌</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#991b1b">Idempotency Key Conflict</text>
    <text x="50" y="54" font-size="11.5" fill="#b91c1c">(Key reused with different body)</text>
  </g>
  <line x1="200" y1="408" x2="200" y2="445" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <g transform="translate(50, 447)">
    <rect width="300" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="20" y="35" font-size="16">🚫</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#b91c1c">HTTP 409 Conflict</text>
    <text x="48" y="50" font-size="11" fill="#7f1d1d">Rejects duplicate transfer attempt</text>
  </g>


  <!-- ================= COLUMN 2: KEY REPLAY (ORANGE) ================= -->
  <g transform="translate(450, 332)">
    <rect width="300" height="76" rx="14" fill="#fffbeb" stroke="#ea580c" stroke-width="2" />
    <text x="20" y="38" font-size="18">⚡</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#9a3412">Duplicate Retry Replay</text>
    <text x="50" y="54" font-size="11.5" fill="#c2410c">(Network timeout safe recovery)</text>
  </g>
  <line x1="600" y1="408" x2="600" y2="445" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" />
  <g transform="translate(450, 447)">
    <rect width="300" height="70" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">📦</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#92400e">Replay Serialized Response</text>
    <text x="48" y="50" font-size="11" fill="#78350f">Exact HTTP 200 · Zero Double Debit</text>
  </g>


  <!-- ================= COLUMN 3: DEADLOCK-FREE LOCKING (BLUE) ================= -->
  <g transform="translate(850, 332)">
    <rect width="300" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="20" y="38" font-size="18">🛡️</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#1e40af">Deterministic Lock Ordering</text>
    <text x="50" y="54" font-size="11.5" fill="#1d4ed8">sort(UUID_from, UUID_to)</text>
  </g>
  <line x1="1000" y1="408" x2="1000" y2="445" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <g transform="translate(850, 447)">
    <rect width="300" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">🐬</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#1e3a8a">Postgres: findByIdForUpdate</text>
    <text x="48" y="50" font-size="11" fill="#1e40af">Lock UUID_min THEN UUID_max</text>
  </g>
  <line x1="1000" y1="517" x2="1000" y2="550" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <g transform="translate(850, 552)">
    <rect width="300" height="66" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">🔒</text>
    <text x="48" y="30" font-size="12.5" font-weight="700" fill="#1e40af">Zero Lock Wait Deadlocks</text>
    <text x="48" y="48" font-size="11" fill="#2563eb">A⇄B concurrency resolves safely</text>
  </g>


  <!-- ================= COLUMN 4: DOUBLE-ENTRY LEDGER (GREEN) ================= -->
  <g transform="translate(1250, 332)">
    <rect width="300" height="76" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="20" y="38" font-size="18">💎</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#15803d">Double-Entry Append-Only</text>
    <text x="50" y="54" font-size="11.5" fill="#166534">TRANSFER_DEBIT + CREDIT</text>
  </g>
  
  <!-- Branch out from Col 4: Overdraft Check vs Settle -->
  <line x1="1340" y1="408" x2="1310" y2="445" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <line x1="1460" y1="408" x2="1490" y2="445" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="1270" y="430" font-size="11" font-weight="700" fill="#dc2626">balance &lt; amt</text>
  <text x="1515" y="430" font-size="11" font-weight="700" fill="#16a34a">balance &gt;= amt</text>

  <!-- Overdraft Rejection -->
  <g transform="translate(1190, 447)">
    <rect width="180" height="70" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
    <text x="14" y="35" font-size="15">❌</text>
    <text x="38" y="32" font-size="11.5" font-weight="700" fill="#991b1b">Overdraft Reject</text>
    <text x="38" y="50" font-size="10.5" fill="#b91c1c">422 Insufficient</text>
  </g>

  <!-- Ledger Persistence -->
  <g transform="translate(1390, 447)">
    <rect width="180" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="14" y="35" font-size="15">📝</text>
    <text x="38" y="32" font-size="11.5" font-weight="700" fill="#15803d">Before / After</text>
    <text x="38" y="50" font-size="10.5" fill="#166534">Snapshots Linked</text>
  </g>

  <line x1="1480" y1="517" x2="1480" y2="550" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <g transform="translate(1360, 552)">
    <rect width="210" height="66" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8" />
    <text x="16" y="35" font-size="16">🪵</text>
    <text x="44" y="30" font-size="12" font-weight="700" fill="#15803d">Fail-Closed Audit Log</text>
    <text x="44" y="48" font-size="10.5" fill="#166534">V7_create_audit_log</text>
  </g>


  <!-- ================= BOTTOM CONVERGENCE & VERIFICATION ================= -->

  <!-- Converge Blue & Green columns to Final Settlement -->
  <line x1="1000" y1="618" x2="1000" y2="648" stroke="#2563eb" stroke-width="2" />
  <line x1="1465" y1="618" x2="1465" y2="648" stroke="#16a34a" stroke-width="2" />
  <line x1="600" y1="517" x2="600" y2="648" stroke="#ea580c" stroke-width="2" />
  <line x1="600" y1="648" x2="1465" y2="648" stroke="#16a34a" stroke-width="2" />
  <line x1="1050" y1="648" x2="1050" y2="675" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)" />

  <!-- Final Success Node -->
  <g transform="translate(850, 678)">
    <rect width="400" height="54" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" />
    <text x="45" y="34" font-size="20">🎉</text>
    <text x="80" y="34" font-size="15" font-weight="700" fill="#15803d">Transfer Finalized · 0 Balance Drift Guaranteed</text>
  </g>

  <!-- Left Side: Automated Testing Gate Box -->
  <g transform="translate(200, 678)">
    <rect width="520" height="54" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.2" />
    <text x="35" y="34" font-size="20">🧪</text>
    <text x="70" y="34" font-size="14.5" font-weight="700" fill="#6d28d9">224 Backend Tests Passed · 100-Run Concurrency IT Passed</text>
  </g>


  <!-- ================= BOTTOM FOOTER PILL ================= -->
  <g transform="translate(480, 848)">
    <!-- Dark Pill Container -->
    <rect width="640" height="38" rx="19" fill="#0f172a" />
    
    <!-- Blue 'OVERVIEW' badge -->
    <rect x="6" y="5" width="92" height="28" rx="14" fill="#2563eb" />
    <text x="52" y="24" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="1">OVERVIEW</text>
    
    <!-- Title Text -->
    <text x="114" y="24" font-size="15" font-weight="700" fill="#f8fafc">Mini Digital Banking Platform - Main Overview</text>
  </g>

</svg>
