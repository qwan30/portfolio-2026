<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Comic Sans MS', Roboto, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#ea580c" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed" />
    </marker>

    <!-- Drop Shadow for Outer Frame -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="#090d16" />

  <!-- Outer Card Frame (White rounded canvas like in Excalidraw UI screenshot) -->
  <rect x="25" y="25" width="1550" height="805" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#soft-shadow)" />

  <!-- ================= TOP SECTION (ROOT & INGRESS) ================= -->

  <!-- Top Root Node: Client & Money Transfers -->
  <g transform="translate(560, 50)">
    <rect width="480" height="52" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" />
    <text x="50" y="32" font-size="20">👥</text>
    <text x="85" y="33" font-size="16" font-weight="700" fill="#15803d">Client Money Transfers &amp; External Settlement</text>
  </g>

  <!-- Arrow Top -> Gateway -->
  <line x1="800" y1="102" x2="800" y2="128" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- Node 2: Fastify + JWT + Idempotency-Key -->
  <g transform="translate(500, 130)">
    <rect width="600" height="54" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" />
    <text x="40" y="34" font-size="20">⚡</text>
    <text x="75" y="34" font-size="14.5" font-weight="700" fill="#1d4ed8">NestJS 11 + Fastify (JWT Bearer Auth + Idempotency-Key Header)</text>
  </g>

  <!-- Arrow Gateway -> TransfersService -->
  <line x1="800" y1="184" x2="800" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- Node 3: TransfersService Orchestrator -->
  <g transform="translate(500, 212)">
    <rect width="600" height="50" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2.2" />
    <text x="35" y="32" font-size="19">⚙️</text>
    <text x="70" y="32" font-size="14.5" font-weight="700" fill="#334155">TransfersService (BigInt Money · State Machine · prisma.$transaction)</text>
  </g>

  <!-- ================= 4 ARCHITECTURAL BRANCHES ================= -->

  <!-- Distribution branch line at y=280 from x=200 to x=1400 -->
  <line x1="800" y1="262" x2="800" y2="280" stroke="#475569" stroke-width="2.2" />
  <line x1="200" y1="280" x2="1400" y2="280" stroke="#475569" stroke-width="2.2" />

  <!-- Drop Lines to 4 Columns -->
  <line x1="200" y1="280" x2="200" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />
  <line x1="600" y1="280" x2="600" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />
  <line x1="1000" y1="280" x2="1000" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />
  <line x1="1400" y1="280" x2="1400" y2="330" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- Column Strategy Labels -->
  <text x="200" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">mode=IDEMPOTENCY_REPLAY</text>
  <text x="600" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">ledger=ZERO_SUM_INVARIANT</text>
  <text x="1000" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">rail=EXTERNAL_ADAPTER_RAIL</text>
  <text x="1400" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">read=DERIVED_PROJECTIONS</text>


  <!-- ================= COLUMN 1: IDEMPOTENCY & CONFLICT GUARD (RED) ================= -->
  <g transform="translate(50, 332)">
    <rect width="300" height="76" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="20" y="38" font-size="18">❌</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#991b1b">RequestHash Mismatch</text>
    <text x="50" y="54" font-size="11.5" fill="#b91c1c">(Key reused with altered body)</text>
  </g>
  <line x1="200" y1="408" x2="200" y2="445" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <g transform="translate(50, 447)">
    <rect width="300" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 4" />
    <text x="20" y="35" font-size="16">🚫</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#b91c1c">HTTP 409 Idempotency Conflict</text>
    <text x="48" y="50" font-size="11" fill="#7f1d1d">Rejects duplicate transfer attempt</text>
  </g>
  <line x1="200" y1="517" x2="200" y2="550" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" />
  <g transform="translate(50, 552)">
    <rect width="300" height="66" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">⚡</text>
    <text x="48" y="30" font-size="12.5" font-weight="700" fill="#92400e">Idempotency Cache Hit</text>
    <text x="48" y="48" font-size="11" fill="#78350f">Replays cached body · No double debit</text>
  </g>


  <!-- ================= COLUMN 2: INTERNAL TRANSFER & ZERO-SUM INVARIANT (GREEN) ================= -->
  <g transform="translate(450, 332)">
    <rect width="300" height="76" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="20" y="38" font-size="18">💎</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#15803d">LedgerService Invariant Gate</text>
    <text x="50" y="54" font-size="11.5" fill="#166534">Σ DEBIT === Σ CREDIT</text>
  </g>
  <line x1="600" y1="408" x2="600" y2="445" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <g transform="translate(450, 447)">
    <rect width="300" height="70" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">📦</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#15803d">Append-Only Postings (BigInt)</text>
    <text x="48" y="50" font-size="11" fill="#166534">Source DEBIT + Destination CREDIT</text>
  </g>
  <line x1="600" y1="517" x2="600" y2="550" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <g transform="translate(450, 552)">
    <rect width="300" height="66" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">🔒</text>
    <text x="48" y="30" font-size="12.5" font-weight="700" fill="#15803d">Immutable JournalEntry</text>
    <text x="48" y="48" font-size="11" fill="#166534">History reconstructable at minor precision</text>
  </g>


  <!-- ================= COLUMN 3: EXTERNAL RAIL & AUTO-COMPENSATION (ORANGE) ================= -->
  <g transform="translate(850, 332)">
    <rect width="300" height="76" rx="14" fill="#fffbeb" stroke="#ea580c" stroke-width="2" />
    <text x="20" y="38" font-size="18">🌐</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#9a3412">ExternalRailRegistry (Ports/Adapters)</text>
    <text x="50" y="54" font-size="11.5" fill="#c2410c">Clearing account intermediary posting</text>
  </g>
  <line x1="1000" y1="408" x2="1000" y2="445" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" />
  <g transform="translate(850, 447)">
    <rect width="300" height="70" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">⚠️</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#92400e">Interbank Rail Rejection</text>
    <text x="48" y="50" font-size="11" fill="#78350f">Settlement fails after source debit</text>
  </g>
  <line x1="1000" y1="517" x2="1000" y2="550" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <g transform="translate(850, 552)">
    <rect width="300" height="66" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">🔄</text>
    <text x="48" y="30" font-size="12.5" font-weight="700" fill="#991b1b">Auto-Compensation Journal</text>
    <text x="48" y="48" font-size="11" fill="#b91c1c">Clearing DEBIT → Source CREDIT (Refund)</text>
  </g>


  <!-- ================= COLUMN 4: READ MODELS & AUDIT STREAM (PURPLE) ================= -->
  <g transform="translate(1250, 332)">
    <rect width="300" height="76" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <text x="20" y="38" font-size="18">📊</text>
    <text x="50" y="34" font-size="13.5" font-weight="700" fill="#6d28d9">Derived Read Models</text>
    <text x="50" y="54" font-size="11.5" fill="#7c3aed">BalanceProjection &amp; Statements</text>
  </g>
  <line x1="1400" y1="408" x2="1400" y2="445" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <g transform="translate(1250, 447)">
    <rect width="300" height="70" rx="14" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">📝</text>
    <text x="48" y="32" font-size="12.5" font-weight="700" fill="#6d28d9">Append-Only AuditEvent Log</text>
    <text x="48" y="50" font-size="11" fill="#5b21b6">Structured event capture with correlation</text>
  </g>
  <line x1="1400" y1="517" x2="1400" y2="550" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <g transform="translate(1250, 552)">
    <rect width="300" height="66" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.8" />
    <text x="20" y="35" font-size="16">🛡️</text>
    <text x="48" y="30" font-size="12.5" font-weight="700" fill="#6d28d9">Fastify Helmet &amp; Rate Limits</text>
    <text x="48" y="48" font-size="11" fill="#7c3aed">OpenAPI /docs contract baseline</text>
  </g>


  <!-- ================= BOTTOM CONVERGENCE & VERIFICATION ================= -->

  <!-- Converge Col 2, 3, 4 lines down to Final Settlement -->
  <line x1="600" y1="618" x2="600" y2="648" stroke="#16a34a" stroke-width="2" />
  <line x1="1000" y1="618" x2="1000" y2="648" stroke="#ea580c" stroke-width="2" />
  <line x1="1400" y1="618" x2="1400" y2="648" stroke="#7c3aed" stroke-width="2" />
  <line x1="600" y1="648" x2="1400" y2="648" stroke="#16a34a" stroke-width="2" />
  <line x1="1050" y1="648" x2="1050" y2="675" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)" />

  <!-- Final Success Node -->
  <g transform="translate(830, 678)">
    <rect width="470" height="54" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" />
    <text x="45" y="34" font-size="20">🎉</text>
    <text x="80" y="34" font-size="15" font-weight="700" fill="#15803d">Zero-Sum Balanced · BigInt Exact Money Conserved</text>
  </g>

  <!-- Left Side: Automated Testing Gate Box -->
  <g transform="translate(150, 678)">
    <rect width="630" height="54" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.2" />
    <text x="35" y="34" font-size="20">🧪</text>
    <text x="70" y="34" font-size="14.5" font-weight="700" fill="#6d28d9">27 Vitest Test Files Passed · Balanced-Journal Invariants Verified</text>
  </g>


  <!-- ================= BOTTOM FOOTER PILL ================= -->
  <g transform="translate(480, 848)">
    <!-- Dark Pill Container -->
    <rect width="640" height="38" rx="19" fill="#0f172a" />
    
    <!-- Blue 'FINANCIAL CORE' badge -->
    <rect x="6" y="5" width="136" height="28" rx="14" fill="#2563eb" />
    <text x="74" y="24" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">FINANCIAL CORE</text>
    
    <!-- Title Text -->
    <text x="156" y="24" font-size="15" font-weight="700" fill="#f8fafc">Ledger Credit &amp; Double-Entry System</text>
  </g>

</svg>
