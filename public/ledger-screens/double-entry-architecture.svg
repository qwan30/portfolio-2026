<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1280" height="860" fill="#f8fafc"/>
  <text x="640" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Double-Entry Ledger — Architecture &amp; Money Movement</text>
  <text x="640" y="78" text-anchor="middle" font-size="15" fill="#64748b">NestJS + Fastify modular monolith · BigInt-exact money · append-only journal · Stripe-style idempotency</text>
  <rect x="60" y="130" width="220" height="130" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">Client</text>
  <text x="170" y="206" text-anchor="middle" font-size="13" fill="#334155">HTTP + JWT bearer</text>
  <text x="170" y="228" text-anchor="middle" font-size="13" fill="#334155">Idempotency-Key header</text>
  <text x="170" y="246" text-anchor="middle" font-size="11.5" fill="#64748b">/api/v1 · Swagger /docs</text>
  <rect x="400" y="100" width="290" height="210" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="545" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">TransfersService</text>
  <text x="545" y="154" text-anchor="middle" font-size="12.5" fill="#475569">createTransfer(input, context)</text>
  <text x="545" y="182" text-anchor="middle" font-size="12.5" fill="#334155">• assertCustomerOwnsResource</text>
  <text x="545" y="202" text-anchor="middle" font-size="12.5" fill="#334155">• currency + balance validation</text>
  <text x="545" y="222" text-anchor="middle" font-size="12.5" fill="#334155">• Money.fromMinorUnits (BigInt)</text>
  <text x="545" y="242" text-anchor="middle" font-size="12.5" fill="#334155">• transfer state machine</text>
  <text x="545" y="266" text-anchor="middle" font-size="12.5" fill="#475569">prisma.$transaction(async tx =&gt; ...)</text>
  <text x="545" y="288" text-anchor="middle" font-size="12.5" fill="#64748b">RECEIVED → VALIDATED → PENDING → SETTLED</text>
  <rect x="810" y="100" width="250" height="140" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="935" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">IdempotencyService</text>
  <text x="935" y="157" text-anchor="middle" font-size="12.5" fill="#334155">(operationType, key) unique</text>
  <text x="935" y="177" text-anchor="middle" font-size="12.5" fill="#334155">SHA-256 requestHash</text>
  <text x="935" y="197" text-anchor="middle" font-size="12.5" fill="#334155">• replay cached response</text>
  <text x="935" y="217" text-anchor="middle" font-size="12.5" fill="#334155">• 409 on hash mismatch</text>
  <rect x="810" y="540" width="250" height="110" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="935" y="572" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">AuditService</text>
  <text x="935" y="595" text-anchor="middle" font-size="12.5" fill="#334155">recordInTransaction(tx, ctx)</text>
  <text x="935" y="617" text-anchor="middle" font-size="12.5" fill="#334155">append-only AuditEvent</text>
  <rect x="400" y="380" width="290" height="190" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">LedgerService</text>
  <text x="545" y="434" text-anchor="middle" font-size="12.5" fill="#334155">postJournalEntry(tx, input)</text>
  <text x="545" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Σ DEBIT === Σ CREDIT</text>
  <text x="545" y="490" text-anchor="middle" font-size="12" fill="#334155">zero-sum invariant · BigInt</text>
  <text x="545" y="512" text-anchor="middle" font-size="12" fill="#334155">• ≥2 postings, same currency</text>
  <text x="545" y="532" text-anchor="middle" font-size="12" fill="#334155">• compensation journal on rail fail</text>
  <text x="545" y="555" text-anchor="middle" font-size="12" fill="#334155">Internal: source DEBIT → dest CREDIT</text>
  <rect x="810" y="380" width="250" height="130" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="935" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Read Models</text>
  <text x="935" y="438" text-anchor="middle" font-size="12.5" fill="#334155">BalanceProjection</text>
  <text x="935" y="458" text-anchor="middle" font-size="12.5" fill="#334155">AccountStatementProjection</text>
  <text x="935" y="484" text-anchor="middle" font-size="11.5" fill="#64748b">derived, never source of truth</text>
  <rect x="120" y="380" width="220" height="140" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="230" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Append-Only Ledger</text>
  <text x="230" y="440" text-anchor="middle" font-size="12.5" fill="#334155">JournalEntry (immutable)</text>
  <text x="230" y="462" text-anchor="middle" font-size="12.5" fill="#334155">Posting (debit / credit)</text>
  <text x="230" y="486" text-anchor="middle" font-size="11.5" fill="#64748b">source of truth</text>
  <text x="230" y="506" text-anchor="middle" font-size="11.5" fill="#64748b">amountMinor: BigInt</text>
  <rect x="120" y="540" width="220" height="110" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="230" y="572" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">External Rail</text>
  <text x="230" y="596" text-anchor="middle" font-size="12.5" fill="#334155">Adapter Registry</text>
  <text x="230" y="618" text-anchor="middle" font-size="12.5" fill="#334155">simulator / mock-bank</text>
  <text x="230" y="638" text-anchor="middle" font-size="11.5" fill="#64748b">Ports &amp; Adapters</text>
  <line x1="280" y1="195" x2="400" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="180" x2="810" y2="180" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="310" x2="545" y2="380" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="690" y1="470" x2="810" y2="440" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="450" x2="340" y2="450" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="570" x2="545" y2="470" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
  <line x1="230" y1="380" x2="230" y2="240" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="230" y1="540" x2="400" y2="470" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="300" y="510" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">on rail fail → compensation</text>
</svg>
